<style>

    font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 0 10px;

<body>

</div>
<script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/dist/lil-gui.umd.min.js"></script>
<script src="../lib/doodle.js?v=d2c580e"></script>
<script src="../lib/cloudfind.js?v=d2c580e"></script>
<script src="../lib/shapenet.js?v=d2c580e"></script>
<script src="../lib/colorfind.js?v=d2c580e"></script>
<script src="../lib/segnet.js?v=d2c580e"></script>
<script src="../lib/samfind.js?v=d2c580e"></script>
<script src="../lib/namefind.js?v=d2c580e"></script>
<script>
// Pick Doodle: faces on the things of the colour you tap (wood blocks, leaves, rocks ...), split along strong
// edges (colorfind.js); the faces are placed by CloudFind.find, and each thing's silhouette picks the animal
// (the shape rules CloudFind.RULES, or the small CNN shapenet.js), as on the cloud camera.
// Sources: a photo, or the camera (live, colour mode; ✂️AI freezes the frame into a photo).
// Option "AIで切り抜く": Segment Anything (samfind.js, runs in the browser) cuts out the tapped thing
// instead; one face per thing (on a still picture: turning it on with the camera live freezes the frame).

const P = {
  photoUrl: 'photos/woodblocks.jpg',
  fit: 'contain',
  // detection
  detW: 300,          // detector width (px)
  tol: 22,            // colour tolerance (Lab distance that still counts as the picked colour)
  lumaW: 0.4,         // how much a lightness difference counts (low = shading is still the same thing)
  edgeThr: 4.0,       // cut the mask where the lightness changes faster than this (0 = no cut)
  edgeW: 0,           // extra width of the cut (px)
  tap: 'pick',        // what a tap does: pick (add a thing / take a tapped one away) / face (change its animal)
  sam: false,         // AI cut-out (Segment Anything) on a still picture (?sam; off: not used)
  segBy: 'color',     // how the picture is split into pieces: 'color' (the tapped colour) / 'segnet' (SegNet: wall, table, curtain ...)
  segSize: 320,       // SegNet: the long side of the picture the model sees (multiples of 32)
  samLevel: '0',      // which of SAM's 3 masks: auto (best score) / 0 small part / 1 / 2 whole thing
  samAuto: true,      // when turned on: cut out the things the colour mode found
  objName: true,      // what each cut-out is called (namefind.js: MobileCLIP2 + ~6400 Japanese words), by its face
  blur: 1.0,          // detector blur (px at detector resolution)
  thrBias: 0.0,       // nudge the automatic threshold (+ = only the whitest clouds)
  minR: 0.03,        // smallest face (inscribed circle radius / photo width)
  maxR: 0.12,         // a bigger bulge still gets a face of at most this radius
  maxFaces: 24,
  sep: 0.9,           // faces must be this far apart (x the sum of their radii / 2 ... 1 = circles touch)
  faceUp: 0.15,       // move the face up toward the bulge's top (0 = circle centre)
  peek: false,        // no "peeking through a hole" faces (holes in a colour mask are mostly gaps, not windows)
  // camera
  detectFps: 8,       // detections per second on the live camera
  follow: 0.4,        // how quickly a face follows its thing (0..1 per detection)
  // character
  kind: 'auto',       // auto = from the shape / random = cat or bear / one animal for all
  kindBy: 'learn',    // the animal from the shape: 'rule' = CloudFind.RULES, 'learn' = the shape classifier (shapenet.js)
  learnMin: 0.3,      // 'learn': below this probability for its best animal, the rules decide
  learnContext: true, // 'learn': the rules about the whole picture (very big -> whale, many small -> sheep) still first
  showName: true,     // the animal's name by each face
  onePer: true,       // one face per piece (off: a big piece can hold several, e.g. touching blocks)
  expression: 'random',
  faceScale: 1.0,     // features radius / circle radius
  eyeSize: 1.2,
  eyeGap: 1.0,
  ears: true,
  earSize: 0.8,
  whiskers: true,
  paws: true,
  arms: false,        // the arms reach for the next lobe: on touching blocks they cross the picture
  blush: 0.0,
  // pen
  ink: '#24140c',
  lineW: 2.8,
  boil: 1.0,          // hand-drawn wobble (px)
  boilFps: 8,
  // life
  blink: true,
  gaze: true,
  breathe: 0.012,
  // misc
  seed: 1,
  showMask: true,
  maskFill: false,    // the recognised area: filled (light) inside, or only its outline
};

const Q = new URLSearchParams(location.search);
if (Q.has('sam')) P.sam = true;
if (Q.has('nosam')) P.sam = false;
if (Q.has('segnet')) P.segBy = 'segnet';
if (Q.has('mask')) P.showMask = true;
if (Q.has('nomask')) P.showMask = false;
if (Q.has('fill')) P.maskFill = true;
if (Q.has('many')) P.onePer = false;
if (Q.has('learn')) P.kindBy = 'learn';
if (Q.has('rule')) P.kindBy = 'rule';
if (Q.has('noname')) P.objName = false;
{ const q = Q.get('photo'); if (q) P.photoUrl = q.includes('/') ? q : 'photos/' + q; }
P.shapeNet = ShapeNet;
const loadShapeNet = () => { if (P.kindBy === 'learn') ShapeNet.load().then(() => { pieceKind.clear(); redetect(); }).catch((e) => console.warn('shapenet', e)); };
loadShapeNet();
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), video = document.getElementById('v');
let img = null, det = null, faces = [];
let mode = 'photo', stream = null;   // 'photo' (img) or 'cam' (the live video)
const src = () => (mode === 'cam' ? video : img);
const srcSize = () => (mode === 'cam' ? [video.videoWidth, video.videoHeight] : img ? [img.width, img.height] : [0, 0]);
const { KINDS, EXPRS, mulberry } = Doodle;
// the animals' names (the rules' Japanese names, plus the ones no rule gives)
const NAME = { peek: 'のぞき', plain: 'かお' };
for (const r of CloudFind.RULES) NAME[r.kind] = r.ja;

// ---------------- detection (colorfind.js -> CloudFind.find)
let refs = [];        // picked Lab colours
let pickAt = null;   // [u, v] 0..1 of the first pick (?pick=u,v), default: the image centre
{ const q = Q.get('pick'); if (q) pickAt = q.split(',').map(Number); }
function detect() {
  const [sw, sh] = srcSize();
  if (!sw || !sh) return;
  if (P.segBy === 'segnet') {   // the latest SegNet result (it runs on its own, segLoop); none yet: keep what is there
    const gw = P.detW, gh = Math.max(8, Math.round(gw * sh / sw));
    if (!segRes || segRes.W !== gw || segRes.H !== gh) return;
    colorDet = segDetOf(segRes);
    if (autoPick) { autoPick = false; const [u, v] = pickAt || [0.5, 0.5]; picks = [{ at: [u * gw, v * gh], ref: null, mask: null }]; }
    colorDet.ids = keepIds(colorDet.label, colorDet.comps.length);
    det = tappedDet();
    placeFaces(); return;
  }
  if (autoPick) {   // nothing tapped yet: the thing at pickAt / the centre
    const d0 = ColorFind.analyse(src(), sw, sh, { ...P, refs: [] });
    const [u, v] = pickAt || [0.5, 0.5], ref = ColorFind.pick(d0, u * d0.w, v * d0.h, 3);
    picks = [{ at: [u * d0.w, v * d0.h], ref, mask: null }]; refs = [ref]; autoPick = false;
  }
  colorDet = ColorFind.analyse(src(), sw, sh, { ...P, refs });
  // one label per connected piece of the colour mask: each piece's silhouette picks its animal
  { const fm = CloudFind.fromMask(colorDet.mask, colorDet.w, colorDet.h, 0.002); colorDet.label = fm.label; colorDet.comps = fm.comps;
    colorDet.ids = keepIds(fm.label, fm.comps.length); }
  det = mode === 'photo' && P.sam && SamFind.ready && samFor === img ? samDet() : tappedDet();
  placeFaces();
}
// ---------------- SegNet (segnet.js): every pixel gets one of 171 kinds (wall, table, curtain, person ...); the
// pieces are the connected places of one kind. It runs back to back in a worker (the camera) or once (a photo);
// detect() takes its latest result
let segRes = null, segFor = null, segRunning = false;
const segSmooth = SegNet.smoother();
async function segLoop() {
  if (segRunning) return;
  segRunning = true;
  try {
    await SegNet.load(status, { worker: true, up: 4 });
    status('SegNet: 準備できました', 2000);
    while (P.segBy === 'segnet') {
      const [sw, sh] = srcSize();
      if (!sw || (mode !== 'cam' && segFor === img)) { await new Promise((r) => setTimeout(r, 100)); continue; }
      const gw = P.detW, gh = Math.max(8, Math.round(gw * sh / sw)), pic = img;
      let r = await SegNet.run(src(), gw, gh, P.segSize);
      if (mode === 'cam') r = segSmooth.apply(r, { hold: 3, sure: 0.9 }); else segSmooth.reset();
      segRes = r; segFor = mode === 'cam' ? null : pic;
      if (mode !== 'cam') redetect();   // the camera: detect() comes on its own
      await new Promise((r) => setTimeout(r, 0));
    }
  } catch (e) {
    console.error(e); status('SegNet: 動きませんでした (' + (e.message || e) + ')', 6000);
    P.segBy = 'color'; gui.controllersRecursive().forEach((c) => c.updateDisplay()); syncButtons(); redetect();
  }
  segRunning = false;
}
// SegNet's labels -> a detector result like the colour one: one label per connected place of one kind
function segDetOf(r) {
  const w = r.W, h = r.H, n = w * h, L = r.label, label = new Int32Array(n).fill(-1), comps = [], st = [];
  for (let s0 = 0; s0 < n; s0++) {
    if (label[s0] >= 0) continue;
    const id = comps.length, c = L[s0], px = []; let x0 = w, x1 = 0;
    label[s0] = id; st.push(s0);
    while (st.length) {
      const i = st.pop(), x = i % w, y = (i - x) / w; px.push(i); if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (x > 0 && label[i - 1] < 0 && L[i - 1] === c) { label[i - 1] = id; st.push(i - 1); }
      if (x < w - 1 && label[i + 1] < 0 && L[i + 1] === c) { label[i + 1] = id; st.push(i + 1); }
      if (y > 0 && label[i - w] < 0 && L[i - w] === c) { label[i - w] = id; st.push(i - w); }
      if (y < h - 1 && label[i + w] < 0 && L[i + w] === c) { label[i + w] = id; st.push(i + w); }
    }
    const keep = px.length >= n * 0.002;
    comps.push({ area: px.length, sky: 1, tex: -1, wid: x1 - x0 + 1, keep, cls: r.names ? r.names[c] : c });
    if (!keep) for (const i of px) label[i] = -1;
  }
  // the pieces touch each other: the mask leaves out their borders, so each one's inside is measured on its own
  const mask = new Uint8Array(n), white = new Float32Array(n);
  let cover = 0;
  for (let i = 0; i < n; i++) {
    const k = label[i], x = i % w; if (k < 0) continue;
    if ((x > 0 && label[i - 1] !== k) || (x < w - 1 && label[i + 1] !== k) || (i >= w && label[i - w] !== k) || (i < n - w && label[i + w] !== k)) continue;
    mask[i] = 1; white[i] = 1; cover++;
  }
  CloudFind.boxBlur(white, w, h, 1);
  return { w, h, mask, white, label, comps, cover: cover / n, D: ColorFind.distance(mask, w, h), thr: 0, thrMode: 'mask',
    sky: new Uint8Array(n), open: new Uint8Array(n).fill(1), seg: true };
}
function segChanged() {
  picks = []; refs = []; autoPick = true; prevLab = null; faces = []; segRes = null; segFor = null; segSmooth.reset();
  if (P.segBy === 'segnet') segLoop();
  syncButtons(); redetect();
}
// the things that were tapped, not every place of a like colour / kind: a tap adds the piece under the finger (and,
// splitting by colour, its colour); a tap on one already there takes it away. Each one is followed on its own: in
// every detection it keeps the pieces that overlap what it had the last time (the camera moves a little between
// two), all as one label (one face, one animal), even when it broke up. Lost (nothing overlaps): nothing, until it
// comes back
let picks = [], autoPick = true;   // picks: { at: [x, y] a fresh tap | null, ref: Lab colour | null, mask, main }
function pieceAt(label, w, h, x, y) {   // the piece under the finger, or the nearest within a few cells (a speck, an edge)
  const tx = Math.floor(x), ty = Math.floor(y);
  for (let r = 0; r <= 6; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    const X = tx + dx, Y = ty + dy; if (X >= 0 && Y >= 0 && X < w && Y < h && label[Y * w + X] >= 0) return label[Y * w + X]; }
  return -1;
}
function tappedDet() {
  const { w, h, label, comps } = colorDet, n = w * h, owner = new Int32Array(comps.length).fill(-1);
  picks.forEach((p, j) => {
    if (p.mask && p.mask.length !== n) p.mask = null;
    p.main = -1;
    if (p.at) { const k = pieceAt(label, w, h, p.at[0], p.at[1]); if (k >= 0 && owner[k] < 0) { owner[k] = j; p.main = k; } p.at = null; }
    else if (p.mask) {
      const ov = new Map();
      for (let i = 0; i < n; i++) { const k = label[i]; if (p.mask[i] && k >= 0 && owner[k] < 0) ov.set(k, (ov.get(k) || 0) + 1); }
      let bv = 0;
      for (const [k, v] of ov) { if (v > bv) { bv = v; p.main = k; } if (v >= 0.3 * comps[k].area) owner[k] = j; }
      if (p.main >= 0) owner[p.main] = j;
    }
    if (p.main >= 0) { p.mask = new Uint8Array(n); for (let i = 0; i < n; i++) if (label[i] >= 0 && owner[label[i]] === j) p.mask[i] = 1; }
  });
  // a tap on nothing goes; a lost one keeps its last mask (to find it again)
  const keep = picks.map((p) => !!p.mask);
  const mask = new Uint8Array(n), lab = new Int32Array(n).fill(-1), white = new Float32Array(n);
  let cover = 0;
  for (let i = 0; i < n; i++) {
    const k = label[i]; if (k < 0 || owner[k] < 0) continue;
    mask[i] = 1; lab[i] = picks[owner[k]].main; white[i] = colorDet.white[i]; cover++;   // the label of a thing: its main piece
  }
  picks = picks.filter((p, j) => keep[j]);
  return { ...colorDet, mask, label: lab, white, cover: cover / n, D: ColorFind.distance(mask, w, h) };
}
// the colour pieces are numbered anew at every detection (in scan order: one piece more or less above shifts all
// the numbers below); a piece that overlaps most with one of the last detection keeps that one's id, so its colour
// in the debug view stays
let prevLab = null, prevIds = null, nextPiece = 1;
function keepIds(label, n) {
  const ids = new Array(n).fill(0);
  if (prevLab && prevLab.length === label.length) {
    const pair = new Map();   // cur * 65536 + prev -> shared pixels
    for (let i = 0; i < label.length; i++) { const a = label[i], b = prevLab[i];
      if (a >= 0 && b >= 0) { const k = a * 65536 + b; pair.set(k, (pair.get(k) || 0) + 1); } }
    const taken = new Set(), from = new Array(n).fill(0);
    for (const [k] of [...pair].sort((x, y) => y[1] - x[1])) {   // the biggest overlaps first
      const a = Math.floor(k / 65536), id = prevIds[k % 65536];
      if (!from[a]) from[a] = id;
      if (!ids[a] && !taken.has(id)) { ids[a] = id; taken.add(id); }
    }
    // a piece split off another (its id was taken): a new id, but it starts with that piece's name, not "…"
    for (let a = 0; a < n; a++) if (!ids[a] && from[a]) { ids[a] = nextPiece++; const e = pieceName.get(from[a]); if (e && e.name) pieceName.set(ids[a], { ...e });
      if (pieceKind.has(from[a])) pieceKind.set(ids[a], pieceKind.get(from[a])); }
  }
  for (let a = 0; a < n; a++) if (!ids[a]) ids[a] = nextPiece++;

}
// ---------------- AI cut-out (samfind.js)
let colorDet = null, objs = [], samBusy = false, samFor = null, nextObj = 1;
const hintEl = document.getElementById('hint');
let hintT = 0;
// errors on the screen too (a phone has no console)
addEventListener('error', (e) => status('エラー: ' + (e.message || e), 8000));
addEventListener('unhandledrejection', (e) => status('エラー: ' + ((e.reason && e.reason.message) || e.reason), 8000));
const status = (t, ms = 0) => { hintEl.textContent = t || ''; clearTimeout(hintT); if (t && ms) hintT = setTimeout(() => (hintEl.textContent = ''), ms); };
// the cut-out things as a detector result for CloudFind.find (one label per thing, later taps on top)
function samDet() {
  const { w, h } = colorDet, n = w * h, label = new Int32Array(n).fill(-1), mask = new Uint8Array(n);
  objs.forEach((o, k) => { for (let i = 0; i < n; i++) if (o.mask[i]) label[i] = k; });
  const comps = objs.map(() => ({ area: 0, keep: true })), white = new Float32Array(n);
  for (let i = 0; i < n; i++) if (label[i] >= 0) { mask[i] = 1; white[i] = 1; comps[label[i]].area++; }
  let cover = 0; for (const c of comps) cover += c.area;
  CloudFind.boxBlur(white, w, h, 1);
  return { ...colorDet, mask, white, label, comps, cover: cover / n, D: ColorFind.distance(mask, w, h), sam: true, ids: objs.map((o) => o.id) };
}
async function samAdd(u, v, add) {
  const { w, h } = colorDet, r = await SamFind.segment(u, v, w, h, P.samLevel);
  if (!r || r.area < 12 || r.area > w * h * 0.6) return false;   // nothing / the whole background
  if (!add) objs = [];
  // the same thing again (e.g. two colour faces on one block): keep one
  for (const o of objs) { let both = 0; for (let i = 0; i < w * h; i++) both += o.mask[i] & r.mask[i];
    if (both > 0.6 * Math.min(o.area, r.area)) return false; }
  r.id = nextObj++; objs.push(r);   // id: its colour in the debug view stays when others come and go
  nameObj(r, img); return true;
}
// what the cut-out is (in the background: the face shows it when it is known)
// the colour pieces with a face get a name too (camera and photo): one at a time, from the picture as it is,
// kept by the piece's id (keepIds) and asked again now and then on the live camera
const pieceName = new Map();   // id -> { name, t }
// the animal of each colour piece, decided the first time it gets a face and kept (its shape changes a little in
// every camera frame, which used to flip it between cat and bear)
var pieceKind = new Map();   // id -> kind
let pieceBusy = false;
function namePieces() {
  if (!P.objName || pieceBusy) return;
  const now = performance.now(), again = mode === 'cam' ? 8000 : Infinity, idOf = (f) => (f.lab >= 0 ? colorDet.ids[f.lab] : 0);
  // the ones still showing "…" first (never asked), then on the camera the ones asked long ago
  const f = faces.find((f) => { const e = idOf(f) && pieceName.get(idOf(f)); return idOf(f) && (!e || (!e.name && now - e.t > 3000)); })
    || faces.find((f) => { const e = idOf(f) && pieceName.get(idOf(f)); return e && now - e.t > again; });
  if (!f) return;
  const id = colorDet.ids[f.lab], { w, h, label } = colorDet, mask = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) mask[i] = label[i] === f.lab ? 1 : 0;
  pieceBusy = true; const old = pieceName.get(id);
  pieceName.set(id, { name: old ? old.name : null, t: now });

gk.add({ clear() { picks = []; refs = []; autoPick = false; redetect(); } }, 'clear').name('選んだ物をぜんぶ外す');
gui.add(P, 'fit', ['contain', 'cover']).name('表示 (写真)').onChange(updateView);
const gd = gui.addFolder('検出');
gd.add(P, 'tol', 4, 60, 0.5).name('色の許容範囲').onFinishChange(redetect);
gd.add(P, 'lumaW', 0, 1, 0.01).name('明るさの差の重み').onFinishChange(redetect);
gd.add(P, 'edgeThr', 0, 20, 0.1).name('境目で切る強さ').onFinishChange(redetect);
gd.add(P, 'edgeW', 0, 3, 1).name('境目の太さ').onFinishChange(redetect);
gd.add(P, 'thrBias', -0.3, 0.3, 0.005).name('しきい値の補正').onFinishChange(redetect);
gd.add(P, 'blur', 0, 6, 1).name('ぼかし').onFinishChange(redetect);
gd.add(P, 'minR', 0.01, 0.15, 0.001).name('最小の顔').onFinishChange(redetect);
gd.add(P, 'maxR', 0.05, 0.4, 0.005).name('最大の顔').onFinishChange(redetect);
gd.add(P, 'maxFaces', 1, 24, 1).name('顔の数').onFinishChange(redetect);
gd.add(P, 'sep', 0.6, 2.5, 0.01).name('顔どうしの間隔').onFinishChange(redetect);
gd.add(P, 'faceUp', 0, 1, 0.01).name('顔を上に寄せる').onFinishChange(redetect);
gd.add(P, 'detectFps', 1, 20, 1).name('カメラ: 1秒の検出回数');
gd.add(P, 'follow', 0.05, 1, 0.01).name('カメラ: 顔の追いかけ');
gd.add(P, 'showMask').name('マスク表示').listen();
const gc = gui.addFolder('キャラ');
gc.add(P, 'expression', ['random', ...EXPRS]).name('表情');
gc.add(P, 'faceScale', 0.4, 1.2, 0.01).name('顔の大きさ').onFinishChange(redetect);
gc.add(P, 'eyeSize', 0.5, 1.8, 0.01).name('目の大きさ');
gc.add(P, 'eyeGap', 0.6, 1.5, 0.01).name('目の間隔');
gc.add(P, 'ears').name('耳');
gc.add(P, 'earSize', 0.4, 2, 0.01).name('耳の大きさ');
gc.add(P, 'whiskers').name('ヒゲ');
gc.add(P, 'paws').name('手 (クマ)');
gc.add(P, 'arms').name('腕');
gc.add(P, 'blush', 0, 1, 0.01).name('ほっぺ');
gc.add(P, 'seed', 1, 999, 1).name('シード').onFinishChange(() => { faces = []; redetect(); });
gc.add({ reroll() { P.seed = 1 + Math.floor(Math.random() * 998); gui.controllersRecursive().forEach(c => c.updateDisplay()); faces = []; redetect(); } }, 'reroll').name('キャラを振り直す');
const gp = gui.addFolder('ペン');
gp.addColor(P, 'ink').name('線の色');
gp.add(P, 'lineW', 0.5, 6, 0.1).name('線の太さ');
gp.add(P, 'boil', 0, 3, 0.05).name('手描きの揺れ');
gp.add(P, 'boilFps', 1, 24, 1).name('揺れの速さ');
const gl = gui.addFolder('動き');
gl.add(P, 'blink').name('まばたき');
gl.add(P, 'gaze').name('視線');
gl.add(P, 'breathe', 0, 0.05, 0.001).name('呼吸');
gui.add({ save() { cv.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'pick_doodle.png'; a.click(); }); } }, 'save').name('PNG保存');
[gd, gc, gp, gl].forEach((f) => f.close());
if (innerWidth < 700) gui.close();   // phones: the buttons first, the settings behind ⚙

resize();
syncButtons();
if (P.segBy === 'segnet') segLoop();
// starts on the camera (a photo when there is none, it is refused, or ?nocam / ?photo=...)
if (Q.has('cam') || !(Q.has('nocam') || Q.has('photo'))) startCam().then((ok) => { if (!ok) loadPhoto(P.photoUrl); });
else loadPhoto(P.photoUrl);
requestAnimationFrame(frame);
</script>
</body>
</html>
