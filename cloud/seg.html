<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Segmentation view</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0d1220; color: #fff; font: 13px/1.45 system-ui, "Hiragino Sans", sans-serif; overflow: hidden; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; text-align: center; padding: 20px; }
  #start button, #start label { font: 600 16px system-ui; padding: 12px 22px; border-radius: 24px; border: 0; background: #3a7be0; color: #fff; cursor: pointer; }
  #start label { background: #ffffff22; }
  #hud { position: fixed; left: 8px; top: calc(8px + env(safe-area-inset-top)); background: #000a; padding: 6px 9px; border-radius: 8px; font: 12px ui-monospace, Consolas, monospace; white-space: pre; pointer-events: none; }
  #err { color: #ff9aa8; }
  #loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #000c; padding: 16px 22px; border-radius: 14px; font-size: 15px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 5; }
  #loading[hidden], #loading .spin[hidden] { display: none; }
  #loading .spin { width: 28px; height: 28px; border: 3px solid #ffffff44; border-top-color: #fff; border-radius: 50%; animation: sp 0.9s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  #rec { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: 64px; height: 64px; border-radius: 50%;
    border: 4px solid #fff; background: #ffffff40; color: #fff; font-size: 22px; display: flex; align-items: center; justify-content: center; padding: 0;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); z-index: 4; }
  #rec.on { background: #e5334d; }
  #msg { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #000b; padding: 6px 12px; border-radius: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
  #credit { position: fixed; right: 8px; bottom: calc(6px + env(safe-area-inset-bottom)); font-size: 11px; opacity: 0.7; pointer-events: none; }
  .lil-gui.root { --width: 270px; max-height: 70vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="start">
  <div style="font-size:18px;font-weight:700">セグメンテーションだけを見るデバッグビュー</div>
  <div style="opacity:.8">顔は描きません。AI が判定した種類を色で重ねて、速さと解像度を調整します。<br>モデル（約 7 MB）はここで初めて読み込みます。</div>
  <button id="cam">カメラで見る</button>
  <label>写真を選ぶ<input type="file" id="file" accept="image/*" hidden></label>
  <div id="err"></div>
</div>
<div id="hud" hidden></div>
<div id="loading" hidden><div class="spin"></div><div id="loadTxt"></div></div>
<button id="rec" hidden aria-label="録画">●</button>
<div id="msg"></div>
<div id="credit" hidden>VOICEVOX:ずんだもん</div>
<video id="v" playsinline muted hidden></video>
<script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/dist/lil-gui.umd.min.js"></script>
<script src="../lib/cloudfind.js?v=47cf05a"></script>
<script src="../lib/segnet.js?v=47cf05a"></script>
<script src="../lib/segdraw.js?v=47cf05a"></script>
<script>
// A debug view of the segmenter alone (segnet.js): the camera / a photo with the AI's classes on top, and the knobs
// that decide its resolution and speed. ?photo=photos/clouds18.jpg opens a photo directly.
// ?talk: tap a region and Zundamon (VOICEVOX, voices made by voice/make_voice.py) says its name.
const $ = (id) => document.getElementById(id), cv = $('c'), ctx = cv.getContext('2d'), video = $('v');
const TALK = new URLSearchParams(location.search).has('talk');
const P = {
  // the model
  size: 448,            // long side of the picture the model sees (multiples of 32)
  every: 0,             // ms between runs (0 = back to back)
  device: 'auto', precision: 'auto', worker: true,
  up: 4,                // output resolution: 1 = 1/8 of the input (blocky), 2 = 1/4, 4 = 1/2, 8 = 1/1 (smooth edges)
  // the view
  color: 'class',       // 'group' (sky / clouds / ground / ...) | 'class' (all 171) | 'confidence'
  opacity: 0.55, smooth: false, labels: true, labelMin: 0.015, lang: 'kana',   // lang: the names in hiragana (for children) or 'en'
  dimLowConf: 0, paused: false,
  fill: false,          // paint the regions
  outline: true,        // trace each region's edge in its colour (a smoothed polyline)
  lineW: 2.5, edgeBlur: 3, edgeSmooth: 4, edgeMin: 0.005,
  edgeGrow: 4,          // push the outlines outward (screen px): smoothing and the blur pull them inside the objects
  edgeBig: 0.07,        // regions over 7% of the picture count as background (their lines move into them)
  camRes: 720, fit: 'contain',
  temporal: true, hold: 3, sure: 0.9,   // steadier labels on video (SegNet.smoother)
  hud: !TALK,           // the numbers top left
  volume: 1,            // the voice (?talk)
  popScale: 2.6,        // how big the tapped label grows (?talk)
  onlyLabelled: TALK,   // outlines only round the pieces that have a name
};
const GCOL = [[90, 150, 240], [255, 255, 255], [160, 110, 60], [60, 170, 60], [130, 130, 140], [230, 60, 60], [170, 90, 200]];
const GJA = ['空', '雲', '地面', '植物', '建物', '人', 'その他'];
let mode = null, img = null, stream = null, seg = null, segSrc = null, stat = null, runs = 0, lastDone = 0, gap = 0, frames = 0, fps = 0, fpsT = performance.now();

// ---------------- sources
async function startCam() {
  try {
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, height: { ideal: P.camRes }, width: { ideal: Math.round(P.camRes * 16 / 9) } } });
    video.srcObject = stream; await video.play(); mode = 'cam'; img = null; begin();
  } catch (e) { $('err').textContent = 'カメラを開けませんでした: ' + (e.name || e.message || e) + '（https で開いてください）'; }
}
function usePhoto(blob) {
  const im = new Image(); im.onload = () => { if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; } img = im; mode = 'photo'; seg = null; begin(); };
  im.src = URL.createObjectURL(blob);
}
$('cam').onclick = () => { unlockAudio(); startCam(); };
$('file').onclick = unlockAudio;
$('file').onchange = (e) => { const f = e.target.files[0]; if (f) usePhoto(f); };
const source = () => mode === 'cam' ? video : img;
const srcSize = () => mode === 'cam' ? [video.videoWidth, video.videoHeight] : img ? [img.width, img.height] : [0, 0];
let started = false;
async function begin() {
  $('start').style.display = 'none'; $('hud').hidden = !P.hud; $('credit').hidden = !TALK; $('rec').hidden = false; resize();
  if (!started) { started = true; await loadModel(); loop(); }
}

// ---------------- the model
let loadMsg = '';
const smooth = SegNet.smoother();
async function loadModel() {
  SegNet.reset(); smooth.reset(); seg = null; stat = null; runs = 0; gap = 0;
  try { await SegNet.load((t) => (loadMsg = t), { worker: P.worker, device: P.device, precision: P.precision, up: P.up }); loadMsg = ''; }
  catch (e) { loadMsg = 'モデルを読み込めませんでした: ' + (e.message || e); $('loading').querySelector('.spin').hidden = true; }
}
let reloading = null;
async function loop() {
  for (;;) {
    const t0 = performance.now(), [sw, sh] = srcSize();
    if (reloading) { await reloading; reloading = null; }
    const stillPhoto = mode === 'photo' && segSrc === img && seg && seg.w === SegNet.inputSize(sw, sh, P.size)[0];
    if (!P.paused && SegNet.ready && sw && !stillPhoto) {
      try {
        let r = await SegNet.run(source(), 0, 0, P.size);
        if (P.temporal && mode === 'cam') r = smooth.apply(r, { hold: P.hold, sure: P.sure });
        seg = r; segSrc = img; runs++;
        const st = { infer: r.ms, prep: r.prep, post: r.post, total: performance.now() - t0 };
        stat = stat ? Object.fromEntries(Object.entries(st).map(([k, v]) => [k, stat[k] * 0.85 + v * 0.15])) : st;
        const now = performance.now(); gap = lastDone ? (gap ? gap * 0.85 + (now - lastDone) * 0.15 : now - lastDone) : 0; lastDone = now;
        view = null;
      } catch (e) { if (String(e.message) !== 'reset') loadMsg = 'エラー: ' + (e.message || e); }
    }
    const dt = performance.now() - t0;
    await new Promise((r) => setTimeout(r, Math.max(P.every - dt, stillPhoto || P.paused ? 100 : 0)));
  }
}

// ---------------- drawing
let view = null, layout = { s: 1, ox: 0, oy: 0 };
function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
}
addEventListener('resize', resize);
function hue(k) { const h = (k * 137.508) % 360, f = (n) => { const q = (n + h / 30) % 12; return Math.round(255 * (0.55 - 0.45 * Math.max(-1, Math.min(q - 3, 9 - q, 1)))); }; return [f(0), f(8), f(4)]; }
function buildView() {
  const W = seg.W, H = seg.H, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'), id = g.createImageData(W, H), A = Math.round(P.opacity * 255);
  const area = new Int32Array(seg.names.length), sx = new Float64Array(seg.names.length), sy = new Float64Array(seg.names.length);
  for (let i = 0; i < W * H; i++) {
    const k = seg.label[i], cf = seg.conf[i] / 255;
    area[k]++; sx[k] += i % W; sy[k] += Math.floor(i / W);
    const col = P.color === 'class' ? hue(k) : P.color === 'confidence' ? [255 * (1 - cf), 255 * cf, 60] : GCOL[seg.group[i]];
    const a = P.dimLowConf > 0 && cf < P.dimLowConf ? A * 0.25 : A;
    id.data.set([col[0], col[1], col[2], a], i * 4);
  }
  g.putImageData(id, 0, 0);
  // the outlines and the names (segdraw.js, shared with the camera's AI view)
  const sd = P.color === 'confidence' ? { lines: [], labels: [] } : SegDraw.build(seg, { by: P.color === 'group' ? 'group' : 'class', blur: P.edgeBlur, smooth: P.edgeSmooth,
    lines: P.outline, onlyLabelled: P.onlyLabelled && P.labels, min: P.edgeMin, big: P.edgeBig, labels: P.labels, labelMin: P.labelMin, nameOf: P.color === 'group' ? (k) => ((P.lang === 'kana' && SegDraw.GKANA) || GJA)[k] : P.lang === 'kana' ? (k) => (SegDraw.KANA || {})[seg.names[k]] || seg.names[k] : null });
  const lines = sd.lines;
  const n = W * H, cls = [...area.keys()].filter((k) => area[k] > 0).sort((a, b) => area[b] - area[a]);
  view = { c, lines, labels: sd.labels, cls: cls.map((k) => ({ k, name: seg.names[k], g: SegNet.groupOf ? SegNet.groupOf[k] : 6, pct: area[k] / n, x: sx[k] / area[k], y: sy[k] / area[k] })) };
}
function frame() {
  frames++; const now = performance.now(); if (now - fpsT > 500) { fps = frames * 1000 / (now - fpsT); frames = 0; fpsT = now; }
  ctx.fillStyle = '#0d1220'; ctx.fillRect(0, 0, cv.width, cv.height);
  const [sw, sh] = srcSize();
  if (mode && sw) {
    const s = (P.fit === 'cover' ? Math.max : Math.min)(cv.width / sw, cv.height / sh);
    layout = { s, ox: (cv.width - sw * s) / 2, oy: (cv.height - sh * s) / 2, w: sw * s, h: sh * s };
    ctx.drawImage(source(), layout.ox, layout.oy, layout.w, layout.h);
    if (seg) {
      if (!view) buildView();
      if (P.fill || P.color === 'confidence' || !P.outline) { ctx.imageSmoothingEnabled = P.smooth; ctx.drawImage(view.c, layout.ox, layout.oy, layout.w, layout.h); ctx.imageSmoothingEnabled = true; }
      SegDraw.draw(ctx, view, { ox: layout.ox, oy: layout.oy, kx: layout.w / seg.W, ky: layout.h / seg.H },
        { dpr: Math.min(2, window.devicePixelRatio || 1), grow: P.edgeGrow, lineW: P.lineW, labels: P.labels, pop: tapPop(now) });
    }
  }
  const f = (v) => v == null ? '-' : v.toFixed(1);
  $('loading').hidden = !loadMsg; $('loadTxt').textContent = loadMsg;
  $('hud').textContent = [
    `${SegNet.device === 'webgpu' ? 'GPU' : SegNet.device ? 'CPU' : '-'} ${SegNet.precision || ''}${SegNet.worker ? ' 別スレッド' : ' メインスレッド'}`,
    `入力 ${seg ? seg.w + 'x' + seg.h : '-'} → 出力 ${seg ? seg.w8 + 'x' + seg.h8 : '-'}`,
    `推論 ${f(stat && stat.infer)} ms  前処理 ${f(stat && stat.prep)}  後処理 ${f(stat && stat.post)}`,
    `1回 ${f(stat && stat.total)} ms  認識 ${gap ? (1000 / gap).toFixed(1) : '-'} 回/秒  画面 ${fps.toFixed(0)} fps`,
    `カメラ ${sw}x${sh}  回数 ${runs}`,
  ].join('\n');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------------- ?talk: tap a region, hear its name
let actx = null, tap = null, voiceList = null, recDest = null;
const voiceBuf = {};
const VOICE = new URL('voice/', (document.querySelector('script[src*="segdraw.js"]') || {}).src || location.href).href,
  VER = new URL((document.querySelector('script[src*="segdraw.js"]') || {}).src || location.href).search;
function unlockAudio() {   // iOS: the audio only plays once it was started in a tap
  if (!TALK) return;
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {}
  if (!voiceList) voiceList = fetch(VOICE + 'voice.json' + VER).then((r) => r.json()).catch(() => ({}));
}
// which phrase: a / b / c by turns (never the same twice in a row); the same thing tapped again: 「また〇〇なのだ！」,
// a third time:「〇〇がすきなのだ？」, then by turns again
let lastWord = null, again = 0, lastP = null, lastAt = 0;
function phraseFor(word) {
  const now = performance.now();   // "again" only within 10 s
  again = word === lastWord && now - lastAt < 10000 ? again + 1 : 0; lastWord = word; lastAt = now;
  if (again === 1) return 'm';
  if (again === 2) return 's';
  const ps = ['a', 'b', 'c'].filter((p) => p !== lastP); lastP = ps[Math.floor(Math.random() * ps.length)];
  return lastP;
}
async function speak(word) {
  if (!actx || !voiceList) unlockAudio();
  if (actx.state !== 'running') actx.resume();
  const vl = await voiceList, n = vl.words ? vl.words[word] : undefined; if (n == null) return;
  const f = `v${n}${phraseFor(word)}.mp3`;
  try {
    voiceBuf[f] = voiceBuf[f] || fetch(VOICE + f + VER).then((r) => r.arrayBuffer()).then((b) => new Promise((ok, ng) => actx.decodeAudioData(b, ok, ng)));
    const src = actx.createBufferSource(), g = actx.createGain(); g.gain.value = P.volume;
    src.buffer = await voiceBuf[f]; src.connect(g).connect(actx.destination); if (recDest) g.connect(recDest);   // and into the recording
    if (speak.cur) try { speak.cur.stop(); } catch (e) {}
    speak.cur = src; src.start();
    if (tap && tap.word === word) tap.dur = performance.now() - tap.t + src.buffer.duration * 1000;   // the label grows back as the voice ends
  } catch (e) { delete voiceBuf[f]; }
}
function onTap(e) {
  if (!TALK || !seg || !layout.w) return;
  const k2 = cv.width / innerWidth, px = e.clientX * k2, py = e.clientY * k2;
  const gx = Math.floor((px - layout.ox) / layout.w * seg.W), gy = Math.floor((py - layout.oy) / layout.h * seg.H);
  if (gx < 0 || gy < 0 || gx >= seg.W || gy >= seg.H) return;
  const byG = P.color === 'group', key = byG ? seg.group : seg.label, k = key[gy * seg.W + gx];
  const word = byG ? (SegDraw.GKANA || GJA)[k] : (SegDraw.KANA || {})[seg.names[k]] || seg.names[k];
  tap = { k, word, gx, gy, t: performance.now(), dur: 1500 };
  speak(word);
}
cv.addEventListener('pointerdown', onTap);
// the tapped region's label: pops up big at once, stays while Zundamon speaks, shrinks back as the voice ends
function tapPop(now) {
  if (!tap) return null;
  const t = now - tap.t, d = tap.dur, up = 180, down = 300;
  if (t >= d) { tap = null; return null; }
  const e = t < up ? 1 - (1 - t / up) ** 3 * Math.cos(t / up * 2.5) : t > d - down ? 0.5 + 0.5 * Math.cos(Math.PI * (t - d + down) / down) : 1;   // a little overshoot going up
  return { k: tap.k, s: 1 + (P.popScale - 1) * e, x: tap.gx, y: tap.gy, name: tap.word };
}
if (TALK) {
  document.title = 'しゃべるセグメンテーション';
  $('start').children[0].textContent = 'さわると、ずんだもんがなまえをおしえてくれるよ';
  $('start').children[1].innerHTML = 'カメラにうつったものや写真のところをタップすると、AI がなにかを見分けて声で教えます。<br>モデル（約 7 MB）はここで初めて読み込みます。<br><small>音声: VOICEVOX:ずんだもん</small>';
}

// ---------------- recording
let msgT = 0;
function say(t, ms = 2200) { const m = $('msg'); m.textContent = t; m.style.opacity = 1; clearTimeout(msgT); msgT = setTimeout(() => (m.style.opacity = 0), ms); }
function stamp() { const d = new Date(), p = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; }
async function shareOrSave(blob, name) {
  const file = new File([blob], name, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
let rec = null;
$('rec').onclick = () => {
  if (rec) { rec.stop(); return; }
  if (!cv.captureStream || !window.MediaRecorder) { say('このブラウザは録画に対応していません'); return; }
  // ?talk: Zundamon's voice goes into the video too (an audio track fed by the same Web Audio graph)
  const tracks = cv.captureStream(30).getVideoTracks();
  if (TALK) {
    unlockAudio();
    try {
      if (!recDest) {
        recDest = actx.createMediaStreamDestination();
        // a constant, inaudible hum: the track then runs from the start (silence alone may leave it empty until
        // the first voice, and the voice would land at the start of the video)
        const o = actx.createOscillator(), q = actx.createGain(); q.gain.value = 0.0005; o.connect(q).connect(recDest); o.start();
      }
      tracks.push(...recDest.stream.getAudioTracks());
    } catch (e) { recDest = null; }
  }
  const withAudio = tracks.length > 1;
  const type = (withAudio ? ['video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'] : ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'])
    .find((t) => MediaRecorder.isTypeSupported(t)) || '';
  const chunks = [];
  rec = new MediaRecorder(new MediaStream(tracks), type ? { mimeType: type, videoBitsPerSecond: 8e6, audioBitsPerSecond: 96e3 } : undefined);
  rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    $('rec').classList.remove('on'); $('rec').textContent = '●';
    const blob = new Blob(chunks, { type: rec.mimeType || type || 'video/webm' }); rec = null;
    shareOrSave(blob, `segmentation_${stamp()}.${(blob.type.includes('mp4') ? 'mp4' : 'webm')}`);
  };
  rec.start(500);
  $('rec').classList.add('on'); $('rec').textContent = '■'; say('録画中… もう一度押すと止まります');
};
if (document.fonts) document.fonts.load('800 16px "M PLUS Rounded 1c"', [...new Set(Object.values(SegDraw.KANA || {}).join('') + (SegDraw.GKANA || []).join('') + GJA.join(''))].join('')).catch(() => {});

// ---------------- knobs
const gui = new lil.GUI({ title: 'セグメンテーション' });
const reload = () => { reloading = loadModel(); };
const gm = gui.addFolder('モデル（速さ・解像度）');
gm.add(P, 'size', [128, 160, 192, 224, 256, 320, 384, 448, 512, 640]).name('入力の大きさ (長い辺 px)').onChange(() => { seg = null; });
gm.add(P, 'up', { '1/8（カクカク）': 1, '1/4': 2, '1/2': 4, '1/1（なめらか）': 8 }).name('出力の解像度 (入力に対して)').onChange(reload);
gm.add(P, 'every', 0, 2000, 10).name('認識の間隔 (ms)');
gm.add(P, 'device', ['auto', 'webgpu', 'wasm']).name('実行 (GPU / CPU)').onChange(reload);
gm.add(P, 'precision', ['auto', 'fp16', 'fp32']).name('精度 (fp16 / fp32)').onChange(reload);
gm.add(P, 'worker').name('別スレッドで実行').onChange(reload);
gm.add(P, 'paused').name('一時停止');
const gt = gui.addFolder('ちらつきを抑える（動画）');
gt.add(P, 'temporal').name('前の結果を引き継ぐ').onChange(() => smooth.reset());
gt.add(P, 'hold', 1, 15, 1).name('何回続いたら切り替えるか');
gt.add(P, 'sure', 0.5, 1, 0.01).name('すぐ切り替える自信の度合い');
const gv = gui.addFolder('表示');
gv.add(P, 'color', { '大分類 (空・雲・地面…)': 'group', '171 種類すべて': 'class', '自信の度合い': 'confidence' }).name('色分け').onChange(() => (view = null));
gv.add(P, 'outline').name('枠線を描く').onChange(() => (view = null));
gv.add(P, 'fill').name('中を塗る').onChange(() => (view = null));
gv.add(P, 'lineW', 0.5, 8, 0.5).name('枠線の太さ');
gv.add(P, 'edgeBlur', 0, 4, 1).name('枠線のなめらかさ (ぼかし)').onChange(() => (view = null));
gv.add(P, 'edgeSmooth', 0, 5, 1).name('枠線の角の丸め (回数)').onChange(() => (view = null));
gv.add(P, 'edgeMin', 0, 0.05, 0.001).name('枠線を引く最小の面積').onChange(() => (view = null));
gv.add(P, 'edgeGrow', -10, 20, 0.5).name('枠線を外に広げる (px)');
gv.add(P, 'edgeBig', 0.02, 0.6, 0.01).name('背景とみなす面積 (広げる向き)').onChange(() => (view = null));
gv.add(P, 'opacity', 0, 1, 0.05).name('塗りの濃さ').onChange(() => (view = null));
gv.add(P, 'smooth').name('なめらかに拡大');
gv.add(P, 'labels').name('名前を表示').onChange(() => (view = null));
gv.add(P, 'onlyLabelled').name('名前のある所だけ枠線').onChange(() => (view = null));
gv.add(P, 'lang', { 'ひらがな': 'kana', '英語': 'en' }).name('名前のことば').onChange(() => (view = null));
gv.add(P, 'labelMin', 0, 0.2, 0.005).name('名前を出す最小の面積');
gv.add(P, 'dimLowConf', 0, 1, 0.05).name('自信がない所を薄く (しきい値)').onChange(() => (view = null));
gv.add(P, 'fit', ['contain', 'cover']).name('画面の合わせ方');
const gc = gui.addFolder('カメラ');

if (TALK) { gv.add(P, 'volume', 0, 1, 0.05).name('声の大きさ'); gv.add(P, 'popScale', 1, 5, 0.1).name('タップした名前の拡大'); }
gc.add(P, 'camRes', [360, 480, 720, 1080]).name('カメラの解像度 (縦)').onChange(() => { if (mode === 'cam') startCam(); });
gui.close();
