<!doctype html>

<head>

<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #1c2340; --sky: #5d9be8; --sky2: #cfe5ff; }
  html, body { margin: 0; height: 100%; background: #0d1220; overflow: hidden; touch-action: manipulation;
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; color: #fff; -webkit-user-select: none; user-select: none; }
  canvas#c { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
  video { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: linear-gradient(var(--sky), var(--sky2)); color: var(--ink); text-align: center; padding: 24px; box-sizing: border-box; }
  #start h1 { font-size: 30px; margin: 0 0 4px; letter-spacing: 0.04em; }
  #devlinks { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 16px; margin-top: 18px; font-size: 13px; }
  #devlinks a { color: inherit; opacity: 0.65; }
  #start p { margin: 0 0 12px; font-size: 14px; line-height: 1.6; opacity: 0.8; }
  #logo { width: 150px; height: 100px; }
  .big { font-size: 17px; padding: 14px 30px; min-width: 220px; border-radius: 999px; border: 2px solid var(--ink);
    background: #fff; color: var(--ink); font-weight: 700; font-family: inherit; }
  .big.sub { background: transparent; }
  #err { color: #a3203a; font-size: 13px; min-height: 1em; max-width: 320px; line-height: 1.5; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 18px calc(18px + env(safe-area-inset-bottom));
    display: none; align-items: center; justify-content: space-around; background: linear-gradient(transparent, #0007); }
  .btn { width: 50px; height: 50px; border-radius: 50%; border: none; background: #ffffff30; color: #fff; font-size: 21px;
    display: flex; align-items: center; justify-content: center; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); padding: 0; }
  #shutter { width: 76px; height: 76px; border: 5px solid #fff; background: #ffffff70; }
  #shutter:active { background: #fff; }
  #rec.on { background: #e5334d; }
  .btn[hidden] { display: none; }
  #ai { font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
  #ai.on { background: #3a7be0; }
  #ai.busy { opacity: 0.55; }
  #msg { position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); background: #000a;
    padding: 7px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .lil-gui.root { position: fixed !important; top: env(safe-area-inset-top); right: 0; max-height: 65vh; overflow: auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="v" playsinline muted autoplay></video>
<div id="start">
  <svg id="logo" viewBox="0 0 150 100" aria-hidden="true">
    <path d="M30 80 Q8 80 12 62 Q14 48 32 50 Q34 28 58 30 Q70 12 92 24 Q116 18 118 44 Q142 46 138 66 Q136 82 114 80 Z" fill="#fff" stroke="#1c2340" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M52 34 L57 16 L68 28 M96 26 L104 12 L110 30" fill="none" stroke="#1c2340" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="66" cy="54" r="7" fill="#fff" stroke="#1c2340" stroke-width="2"/><circle cx="66" cy="55" r="4.2" fill="#1c2340"/>
    <circle cx="94" cy="54" r="7" fill="#fff" stroke="#1c2340" stroke-width="2"/><circle cx="94" cy="55" r="4.2" fill="#1c2340"/>
    <path d="M76 63 L84 63 L80 67 Z" fill="#1c2340"/><path d="M80 67 Q76 72 72 68 M80 67 Q84 72 88 68" fill="none" stroke="#1c2340" stroke-width="2" stroke-linecap="round"/>
  </svg>
  <h1>Cloud Faces</h1>
  <p>空にカメラを向けると、<br>雲に猫やくまの顔が出てきます。</p>
  <button class="big" id="goCam">カメラで始める</button>
  <button class="big sub" id="goPhoto">写真を選ぶ</button>
  <div id="err"></div>
  <nav id="devlinks"><a href="debug.html">デバッグ（顔・ルール・写真）</a><a href="seg.html">セグメンテーション表示</a><a href="seg.html?talk">セグメンテーション（ずんだもんがしゃべる版）</a></nav>
</div>
<div id="bar">
  <button class="btn" id="pick" aria-label="写真を選ぶ">🖼</button>
  <button class="btn" id="ai" aria-label="AIで見る" hidden>AI</button>
  <button class="btn" id="shutter" aria-label="撮影"></button>
  <button class="btn" id="rec" aria-label="録画">●</button>
  <button class="btn" id="flip" aria-label="カメラ切替（外側 / 自分側）">🔄</button>
  <button class="btn" id="more" aria-label="設定">⚙</button>
</div>
<input type="file" id="file" accept="image/*" hidden>
<div id="msg"></div>
<div id="flash"></div>
<script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/dist/lil-gui.umd.min.js"></script>
<script src="../lib/doodle.js?v=3ec2ea4"></script>
<script src="../lib/cloudfind.js?v=3ec2ea4"></script>
<script src="../lib/shapenet.js?v=3ec2ea4"></script>
<script src="../lib/segnet.js?v=3ec2ea4"></script>
<script src="../lib/segdraw.js?v=3ec2ea4"></script>
<script>
// Cloud Faces: camera (or a photo) -> find the cloud bulges (cloudfind.js) several times a
// second -> follow each bulge as a track -> doodle a cat / bear face on it (doodle.js).
const P = {
  // detection
  detW: 180, blur: 2, thrBias: 0.0, minR: 0.03, minFace: 0.07, maxR: 0.22, maxFaces: 6, sep: 1.15, faceUp: 0.6, faceScale: 1.0,
  detectFps: 12,
  follow: 0.35,       // how quickly a face follows its cloud (0..1 per detection)
  // character
  kind: 'auto', expression: 'random', eyeSize: 1.2, eyeGap: 1.0, ears: true, earSize: 0.8,
  whiskers: true, paws: true, arms: true, snakeBody: false, blush: 0.25,
  // pen
  ink: '#1c2340', lineW: 2.4, boil: 1.0, boilFps: 8,
  blink: true, gaze: true,
  showMask: false,
  aiShow: true,       // AI mode: show every part the AI cut out, one colour each
  aiSize: 448,        // AI mode: the long side of the picture the AI sees (smaller = faster, coarser)
  aiUp: 4,            // AI mode: its output resolution: 1 = 1/8 of the input (blocky), 2 = 1/4, 4 = 1/2, 8 = 1/1
  // AI mode, the view of what it saw (as seg.html): coloured outlines per class, smoothed, pushed outward
  aiLineW: 2.5, aiEdgeBlur: 3, aiEdgeSmooth: 4, aiEdgeMin: 0.005, aiEdgeGrow: 4, aiEdgeBig: 0.07, aiLabels: false, aiLabelMin: 0.015,
  aiLineCol: '#1c2340',   // AI mode: every outline in this colour (the faces' ink); '' = each class its own colour
  aiFaceSrc: 'ai',    // AI mode: what the faces go on: 'ai' = the AI's regions alone, 'mix' = the colour detection inside the AI's sky
  aiPen: false,       // AI mode: also trace the shapes the faces went on with the black pen
  aiTemporal: true, aiHold: 3, aiSure: 0.9,   // AI mode: steadier labels on video (SegNet.smoother)
  aiStats: true,      // AI mode: show the frame rate at the top
  kindBy: 'rule',     // which animal a cloud gets: 'rule' = the shape rules (CloudFind.RULES), 'learn' = the shape classifier (shapenet.js)
  learnMin: 0.3,      // 'learn': below this probability for its best animal, the rules decide
  learnContext: true, // 'learn': the sky rules (a very big cloud -> whale, a flock of small ones -> sheep) still first
  aiEvery: 0,         // AI mode: at least this many ms between two AI runs (the camera keeps running)
  aiGround: true,     // AI mode: no faces on the ground (grass, sand, road, water, ... as the AI sees it)
  outline: true, outlineW: 1.0,   // trace the clouds' edges with the pen
};
// what was tuned on debug.html in this browser (only the changes): the face style, the shape rules and, per
// animal, the face adjustments (Doodle.draw's o.perKind)
let DBG = null;
try { DBG = JSON.parse(localStorage.getItem('cloudDebug') || 'null'); } catch (e) { DBG = null; }
if (DBG) Object.assign(P, DBG.face || {}, DBG.rule || {}, DBG.other || {});
const PERKIND = (DBG && DBG.kind) || null;
P.learnW = (DBG && DBG.learn) || {}; P.shapeNet = ShapeNet;   // the classifier's per-animal weights (debug page)
const loadShapeNet = () => { if (P.kindBy === 'learn') ShapeNet.load().catch((e) => console.warn('shapenet', e)); };
loadShapeNet();
const { KINDS, EXPRS, mulberry } = Doodle;
const $ = (id) => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d'), video = $('v');
let mode = null, img = null, stream = null, facing = new URLSearchParams(location.search).has('front') ? 'user' : 'environment';   // ?front: the front camera
let det = null, tracks = [], nextId = 1, lastDet = 0, seedBase = Math.floor(Math.random() * 1e6);

// ---------------- messages
let msgT;
function say(s, ms = 2200) { const m = $('msg'); m.textContent = s; m.style.opacity = 1; clearTimeout(msgT); msgT = setTimeout(() => (m.style.opacity = 0), ms); }

// ---------------- sources
async function startCam() {
  $('err').textContent = '';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    $('err').textContent = 'このページではカメラが使えません。https:// のアドレスで開いてください（「写真を選ぶ」は使えます）。';
    return false;
  }
  try {
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({ audio: false,
      video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
    video.srcObject = stream;
    await video.play();
    ai.ctx = null; ai.parts = []; mode = 'cam'; img = null; tracks = []; showApp();
    return true;
  } catch (e) {
    $('err').textContent = 'カメラを開けませんでした: ' + (e.name || e.message || e);
    return false;
  }
}
function usePhoto(file) {
  const im = new Image();
  im.onload = () => {
    if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
    ai.ctx = null; ai.parts = []; img = im; mode = 'photo'; tracks = []; lastDet = 0; showApp();
  };
  im.src = URL.createObjectURL(file);
}
function showApp() { $('start').style.display = 'none'; $('bar').style.display = 'flex'; resize(); if (DBG && Object.keys(DBG).length && !showApp.told) { showApp.told = true; say('デバッグページで変えた設定を使っています', 3000); } }
const source = () => mode === 'cam' ? video : img;
const srcSize = () => mode === 'cam' ? [video.videoWidth, video.videoHeight] : img ? [img.width, img.height] : [0, 0];

$('goCam').onclick = () => startCam();
$('goPhoto').onclick = () => $('file').click();
$('pick').onclick = () => $('file').click();
// the back camera <-> the front one (a photo: back to the camera)
$('flip').onclick = () => { if (mode === 'cam') facing = facing === 'environment' ? 'user' : 'environment'; startCam(); };
$('file').onchange = (e) => { const f = e.target.files[0]; if (f) usePhoto(f); e.target.value = ''; };

// ---------------- view: source cover-fit to the canvas
let view = { s: 1, ox: 0, oy: 0, k: 1 };
function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
}
addEventListener('resize', resize);
function updateView() {
  const [sw, sh] = srcSize(); if (!sw || !det) return;
  const s = Math.max(cv.width / sw, cv.height / sh);
  view = { s, ox: (cv.width - sw * s) / 2, oy: (cv.height - sh * s) / 2, k: sw / det.w * s };
}
// tracks live in normalised detector coordinates (x / det.w, y / det.w)
const toScr = (x, y) => [view.ox + x * det.w * view.k, view.oy + y * det.w * view.k];

// ---------------- tracking: each cloud bulge keeps its face (and character) from frame to frame
function newTrack(f, W) {
  const r = mulberry(seedBase + nextId * 7919);
  return { id: nextId++, x: f.fx / W, y: f.fy / W, r: f.r / W, ears: f.ears && f.ears.map((e) => ({ ...e, x: e.x / W, y: e.y / W })),
    paws: f.paws && f.paws.map((p) => ({ x: p.x / W, y: p.y / W })), hits: 1, miss: 0, alpha: 0,
    body: f.body && f.body.map((q) => ({ x: q.x / W, y: q.y / W, half: q.half / W })),
    arms: f.arms && f.arms.map((a) => ({ sx: a.sx / W, sy: a.sy / W, x: a.x / W, y: a.y / W })),
    wings: f.wings && f.wings.map((q) => ({ x: q.x / W, y: q.y / W })), hole: f.hole, holePoly: f.holePoly && f.holePoly.map((q) => ({ x: q.x / W, y: q.y / W })), tail: f.tail && { ...f.tail, x: f.tail.x / W, y: f.tail.y / W }, hint: f.hint, kind0: f.hint || KINDS[r() < 0.5 ? 0 : 1], kindR: KINDS[r() < 0.5 ? 0 : 1], expr0: EXPRS[Math.floor(r() * EXPRS.length)], kindOver: null, exprOver: null,
    pupil: 0.48 + r() * 0.17, ph: r() * 100, seed: Math.floor(r() * 1e6) };
}
function absorb(t, f, W) {
  const k = mode === 'photo' ? 1 : P.follow, mix = (a, b) => a + k * (b - a);
  t.x = mix(t.x, f.fx / W); t.y = mix(t.y, f.fy / W); t.r = mix(t.r, f.r / W);
  const pts = (cur, nw, isEar) => {
    if (!nw) return null;
    if (!cur) return nw.map((e) => isEar ? { ...e, x: e.x / W, y: e.y / W } : { x: e.x / W, y: e.y / W });
    return nw.map((e, i) => { const c = cur[i];
      const o = { x: mix(c.x, e.x / W), y: mix(c.y, e.y / W) };
      if (isEar) { let nx = mix(c.nx, e.nx), ny = mix(c.ny, e.ny); const l = Math.hypot(nx, ny) || 1; o.nx = nx / l; o.ny = ny / l; }
      return o; });
  };
  t.ears = pts(t.ears, f.ears, true); t.paws = pts(t.paws, f.paws, false);
  // the body follows the cloud as it is now; arms come and go with the lobes
  t.body = f.body ? f.body.map((q) => ({ x: q.x / W, y: q.y / W, half: q.half / W })) : t.kind0 === 'snake' ? t.body : null;
  if (f.hole) t.hole = f.hole;
  if (f.holePoly) t.holePoly = f.holePoly.map((q) => ({ x: q.x / W, y: q.y / W }));
  if (f.wings) t.wings = t.wings ? f.wings.map((q, i) => ({ x: mix(t.wings[i].x, q.x / W), y: mix(t.wings[i].y, q.y / W) })) : f.wings.map((q) => ({ x: q.x / W, y: q.y / W }));
  if (f.tail) t.tail = t.tail ? { x: mix(t.tail.x, f.tail.x / W), y: mix(t.tail.y, f.tail.y / W), dx: f.tail.dx, dy: f.tail.dy } : { ...f.tail, x: f.tail.x / W, y: f.tail.y / W };
  if (!f.arms) t.arms = null;
  else if (!t.arms || t.arms.length !== f.arms.length) t.arms = f.arms.map((a) => ({ sx: a.sx / W, sy: a.sy / W, x: a.x / W, y: a.y / W }));
  else t.arms = f.arms.map((a, i) => { const c = t.arms[i]; return { sx: mix(c.sx, a.sx / W), sy: mix(c.sy, a.sy / W), x: mix(c.x, a.x / W), y: mix(c.y, a.y / W) }; });
  t.hits++; t.miss = 0;
}
function updateTracks(found, dt) {
  const W = det.w, used = new Set();
  // longest-lived tracks pick first
  for (const t of [...tracks].sort((a, b) => b.hits - a.hits)) {
    let best = -1, bd = 1e9;
    found.forEach((f, i) => {
      if (used.has(i)) return;
      const d = Math.hypot(f.fx / W - t.x, f.fy / W - t.y);
      if (d < Math.max(t.r, f.r / W) * 1.3 && d < bd) { bd = d; best = i; }
    });
    if (best >= 0) { used.add(best); absorb(t, found[best], W); } else t.miss += dt;
  }
  found.forEach((f, i) => { if (!used.has(i)) tracks.push(newTrack(f, W)); });
  tracks = tracks.filter((t) => t.miss < 1.0 || t.alpha > 0.02);
}

// ---------------- drawing
let boilFrame = 0;
const style = () => ({ ink: P.ink, lineW: P.lineW, boil: P.boil, boilFrame, eyeSize: P.eyeSize, eyeGap: P.eyeGap,
  earSize: P.earSize, ears: P.ears, whiskers: P.whiskers, paws: P.paws, blush: P.blush,
  dpr: Math.min(2, window.devicePixelRatio || 1), gaze: P.gaze, blink: P.blink, snakeBody: P.snakeBody, perKind: PERKIND });
function drawTrack(t, time, o) {
  const [x, y] = toScr(t.x, t.y + Math.sin(time * 0.9 + t.ph) * t.r * 0.01);
  const U = t.r * det.w * P.faceScale * view.k * (1 + 0.012 * Math.sin(time * 1.4 + t.ph));
  t.x0 = x; t.y0 = y; t.U0 = U;
  const d = Object.assign(t, { kind: t.kindOver || (P.kind === 'auto' ? t.kind0 : P.kind === 'random' ? t.kindR : P.kind),
    expr: t.exprOver || (P.expression === 'random' ? t.expr0 : P.expression) });
  Doodle.draw(ctx, { ...d, x, y, U, rot: 0, alpha: t.alpha,
    ears: t.ears && t.ears.map((e) => { const [ex, ey] = toScr(e.x, e.y); return { x: ex, y: ey, nx: e.nx, ny: e.ny }; }),
    paws: t.paws && t.paws.map((p) => { const [px, py] = toScr(p.x, p.y); return { x: px, y: py }; }),
    holePoly: t.holePoly && t.holePoly.map((q) => { const [hx, hy] = toScr(q.x, q.y); return { x: hx, y: hy }; }),
    wings: t.wings && t.wings.map((q) => { const [wx, wy] = toScr(q.x, q.y); return { x: wx, y: wy }; }),
    tail: t.tail && (() => { const [tx, ty] = toScr(t.tail.x, t.tail.y); return { x: tx, y: ty, dx: t.tail.dx, dy: t.tail.dy }; })(),
    arms: P.arms && t.arms && t.arms.map((a) => { const [sx, sy] = toScr(a.sx, a.sy), [ax, ay] = toScr(a.x, a.y); return { sx, sy, x: ax, y: ay }; }),
    body: t.body && t.body.map((q) => { const [bx, by] = toScr(q.x, q.y); return { x: bx, y: by, half: q.half * det.w * view.k }; }) }, o);
}
// the clouds' edges, traced with the same pen as the faces
function drawOutlines(o) {
  if (det._ol === undefined) det._ol = CloudFind.outlines(det, P);
  det._ol.forEach((l, k) => Doodle.stroke(ctx, l.pts.map(([x, y]) => [view.ox + x * view.k, view.oy + y * view.k]), o,
    { width: P.outlineW, seed: 1000 + k, closed: l.closed }));
}
// the AI's labels at its own output size -> the W x H detection grid (nearest)
function resampleSeg(r, W, H) {
  const label = new Uint8Array(W * H), group = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) {
    const yy = Math.min(r.H - 1, Math.floor((y + 0.5) / H * r.H));
    for (let x = 0; x < W; x++) { const j = yy * r.W + Math.min(r.W - 1, Math.floor((x + 0.5) / W * r.W)); label[y * W + x] = r.label[j]; group[y * W + x] = r.group[j]; }
  }
  return { ...r, label, group, W, H };
}
// what the AI saw (as seg.html, segdraw.js): every class's edge in its colour, smoothed and pushed outward, the
// backgrounds traced along the picture's border, the names inside their regions
function drawParts() {
  const sg = ai.segN;
  if (!ai.view) ai.view = SegDraw.build(sg, { by: 'class', blur: P.aiEdgeBlur, smooth: P.aiEdgeSmooth, min: P.aiEdgeMin, big: P.aiEdgeBig,
    labels: P.aiLabels, labelMin: P.aiLabelMin, nameOf: (k) => JA[sg.names[k]] || sg.names[k] });
  const [sw, sh] = srcSize();
  SegDraw.draw(ctx, ai.view, { ox: view.ox, oy: view.oy, kx: sw * view.s / sg.W, ky: sh * view.s / sg.H },
    { dpr: Math.min(2, window.devicePixelRatio || 1), grow: P.aiEdgeGrow, lineW: P.aiLineW, labels: P.aiLabels, color: P.aiLineCol });
}
// the frame rate, at the top (with the AI on)
let fpsN = 0, fpsT = 0, fps = 0;
function drawAiStats() {
  const dpr = Math.min(2, window.devicePixelRatio || 1), fs = Math.round(12 * dpr), t = `${fps.toFixed(0)} fps`;
  ctx.save(); ctx.font = `${fs}px ui-monospace, Consolas, monospace`; ctx.textBaseline = 'top';
  const w = ctx.measureText(t).width + fs, y0 = fs * 4.2;
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(fs * 0.6, y0, w, fs * 1.6);
  ctx.fillStyle = '#fff'; ctx.fillText(t, fs * 1.1, y0 + fs * 0.3);
  ctx.restore();
}
function hsl(h, s, l) {
  const f = (n) => { const k = (n + h / 30) % 12, a = s * Math.min(l, 1 - l); return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); };
  return [f(0), f(8), f(4)];
}
let maskCanvas = null;
function drawMask() {
  if (!maskCanvas) maskCanvas = document.createElement('canvas');
  if (maskCanvas.width !== det.w || maskCanvas.height !== det.h) { maskCanvas.width = det.w; maskCanvas.height = det.h; }
  const m = maskCanvas.getContext('2d'), id = m.createImageData(det.w, det.h);
  for (let i = 0; i < det.w * det.h; i++) { id.data[i * 4] = 255; id.data[i * 4 + 1] = 60; id.data[i * 4 + 2] = 160; id.data[i * 4 + 3] = det.mask[i] ? 110 : 0; }
  m.putImageData(id, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(maskCanvas, view.ox, view.oy, det.w * view.k, det.h * view.k);
  ctx.imageSmoothingEnabled = true;
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  fpsN++; if (now - fpsT > 500) { fps = fpsN * 1000 / (now - fpsT); fpsN = 0; fpsT = now; }
  const [sw, sh] = srcSize();
  ctx.fillStyle = '#0d1220'; ctx.fillRect(0, 0, cv.width, cv.height);
  if (mode && sw && sh) {
    const every = mode === 'photo' ? 400 : 1000 / P.detectFps;
    if (now - lastDet > every) {
      const ddt = lastDet ? Math.min(0.5, (now - lastDet) / 1000) : 0; lastDet = now;
      det = CloudFind.analyse(source(), sw, sh, P);
      const useAi = ai.active && ai.ctx && ai.ctx.W === det.w && ai.ctx.H === det.h;
      updateTracks(useAi ? aiFaces() : CloudFind.find(det, P), ddt);
      updateView();
    }
    ctx.drawImage(source(), view.ox, view.oy, sw * view.s, sh * view.s);
    if (det) {
      if (P.showMask) drawMask();
      if (ai.active && P.aiShow && ai.segN) drawParts();
      boilFrame = P.boil > 0 ? Math.floor(now / 1000 * P.boilFps) : 0;
      const o = style(), time = now / 1000;
      if (P.outline && (!ai.active || P.aiPen)) drawOutlines(o);   // with the AI on: the clouds and things it kept (off by default)
      if (ai.active && P.aiStats) drawAiStats();
      for (const t of tracks) {
        const target = t.hits >= 3 && t.miss < 0.3 ? 1 : t.miss >= 0.3 ? 0 : t.alpha;
        t.alpha += (target - t.alpha) * Math.min(1, dt * 5);
        Doodle.life(t, dt, o);
        drawTrack(t, time, o);
      }
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// ?photo=photos/clouds.jpg opens that picture directly (testing on a PC)
{ const q = new URLSearchParams(location.search).get('photo');
  if (q) fetch(q.includes('/') ? q : 'photos/' + q).then((r) => r.blob()).then(usePhoto).catch(() => {}); }

// ---------------- AI mode (the AI button): freeze the frame and ask our segmenter (segnet.js, COCO-Stuff 171
// classes: sky, clouds, grass, tree, building, person, ...) what is where. The clouds are then found with the
// colour detection, but only inside the sky the AI sees; the ground gets no faces; every other thing (tree,
// building, person, ...) gets the animal its shape looks like. The model (~6 MB) is only downloaded on the
// first press, then cached by the browser.
const aiSmooth = SegNet.smoother();
const ai = { active: false, busy: false, parts: [], view: null, ctx: null, runs: 0, ms: 0 };
function aiOff() {
  if (!ai.active) return;
  ai.active = false; ai.ctx = null; ai.parts = []; ai.view = null; aiSmooth.reset(); $('ai').classList.remove('on');
  lastDet = 0;
}
const JA = { 'sky-other': '空', clouds: '雲', person: '人', tree: '木', bush: '茂み', 'building-other': '建物', house: '家', skyscraper: 'ビル',
  car: '車', bus: 'バス', truck: 'トラック', bicycle: '自転車', dog: '犬', cat: '猫', bird: '鳥', bench: 'ベンチ', fence: '柵', tent: 'テント',
  'playingfield': '広場', grass: '草', sand: '砂', dirt: '土', pavement: '舗道', road: '道', sea: '海', river: '川', mountain: '山', hill: '丘',
  'wall-concrete': '壁', 'wall-other': '壁', roof: '屋根', bridge: '橋', umbrella: '傘', kite: '凧', flower: '花', 'plant-other': '植物', light: '照明',
  gravel: '砂利', table: 'テーブル', keyboard: 'キーボード', chair: '椅子', 'floor-wood': '床', 'ground-other': '地面', 'building-other-merged': '建物' };
// the names' rounded font: a canvas does not fetch a web font's Japanese part by itself, so ask for it with the names
if (document.fonts) document.fonts.load('800 16px "M PLUS Rounded 1c"', Object.values(JA).join('') + 'abcdefghijklmnopqrstuvwxyz-').catch(() => {});
// the AI button: on = the AI keeps running in the background on the live camera (or the photo); each result
// (what is sky / clouds / ground / a thing) is used by the normal detection until the next one comes in
async function aiRun() {
  if (ai.busy) return;
  if (ai.active) { aiOff(); say('AI: オフ', 1500); return; }
  if (!mode) return;
  ai.busy = true; $('ai').classList.add('busy');
  // ask the browser to keep the downloaded model (else it may be cleared when storage runs low)
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* not supported */ }
  try {
    if (!SegNet.ready) say('AI: はじめてなのでモデルをダウンロードします（約 7 MB、次からはいりません）', 4000);
    await SegNet.load((t) => say(t, 60000), { up: P.aiUp });
    ai.active = true; ai.runs = 0; $('ai').classList.add('on');
    say('AI: オン（カメラはそのまま、裏で認識し続けます）', 2500);
    aiLoop();
  } catch (e) {
    console.error(e);
    say('AI を使えませんでした: ' + (e.message || e), 4000);
  } finally {
    ai.busy = false; $('ai').classList.remove('busy');
  }
}
async function aiLoop() {
  let lastImg = null;
  while (ai.active) {
    const t0 = performance.now();
    const [sw, sh] = srcSize();
    if (det && sw && !(mode === 'photo' && lastImg === img && ai.ctx)) {   // a still photo: once is enough
      try {
        const tg = performance.now();
        const k = Math.min(1, P.aiSize / Math.max(sw, sh)), c = ai.grab || (ai.grab = document.createElement('canvas'));
        c.width = Math.round(sw * k); c.height = Math.round(sh * k);
        c.getContext('2d').drawImage(source(), 0, 0, c.width, c.height);
        const W = det.w, H = det.h, tr = performance.now(), segN0 = await SegNet.run(c, 0, 0, P.aiSize),
          segN = P.aiTemporal && mode === 'cam' ? aiSmooth.apply(segN0, { hold: P.aiHold, sure: P.aiSure }) : segN0, seg = resampleSeg(segN, W, H);
        ai.segN = segN; ai.view = null;
        if (!ai.active) break;
        const tp = performance.now(); aiPrep(seg, W, H); lastImg = img; ai.runs++; ai.ms = seg.ms;
        const te = performance.now(), st = { grab: tr - tg, prep: seg.prep, infer: seg.ms, post: seg.post, faces: te - tp, total: te - tg, size: `${seg.w}x${seg.h}` };
        ai.stat = ai.stat ? Object.fromEntries(Object.entries(st).map(([k2, v]) => [k2, typeof v === 'number' ? ai.stat[k2] * 0.8 + v * 0.2 : v])) : st;
        ai.gap = ai.last ? ai.gap ? ai.gap * 0.8 + (te - ai.last) * 0.2 : te - ai.last : 0; ai.last = te;
        if (ai.runs === 1) say(`AI: 認識中（${SegNet.device === 'webgpu' ? 'GPU' : 'CPU'} 1回 ${Math.round(seg.ms)} ms）`, 2500);
      } catch (e) { if (!ai.active) break; console.error(e); say('AI を使えませんでした: ' + (e.message || e), 4000); aiOff(); break; }
    }
    // wait: the rest of aiEvery (0 = the next run right away)
    const dt = performance.now() - t0;
    await new Promise((r) => setTimeout(r, Math.max(P.aiEvery - dt, 0)));
  }
}
// one AI result -> what the detection needs until the next one: the sky (a little wider, so the cloud edges are
// inside), the ground, and the faces of the other things (one part per class, its shape's animal)
function aiPrep(seg, W, H) {
  const n = W * H, Gs = SegNet.G, grp = seg.group;
  const sky0 = new Uint8Array(n); for (let i = 0; i < n; i++) sky0[i] = grp[i] === Gs.SKY || grp[i] === Gs.CLOUDS ? 1 : 0;
  const sky = new Uint8Array(n);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let v = 0; for (let dy = -1; dy <= 1 && !v; dy++) for (let dx = -1; dx <= 1; dx++) { const X = x + dx, Y = y + dy; if (X >= 0 && Y >= 0 && X < W && Y < H && sky0[Y * W + X]) { v = 1; break; } }
    sky[y * W + x] = v;
  }
  const gm = new Uint8Array(n); for (let i = 0; i < n; i++) gm[i] = grp[i] === Gs.GROUND ? 1 : 0;
  const parts = [{ mask: sky0, kind: 'sky', name: null }];
  if (P.aiGround) parts.push({ mask: gm, kind: 'ground', name: '地面' });
  const things = [], thingMask = new Uint8Array(n), names = [];
  const area = new Int32Array(seg.names.length); for (let i = 0; i < n; i++) area[seg.label[i]]++;
  // the biggest few kinds of thing only (each costs a shape analysis)
  const order = [...area.keys()].filter((cl) => {
    if (area[cl] < n * 0.012) return false;
    const gg = grp[seg.label.indexOf(cl)];
    return !(gg === Gs.SKY || gg === Gs.CLOUDS || (gg === Gs.GROUND && P.aiGround));
  }).sort((a, b) => area[b] - area[a]).slice(0, 4);
  for (const cl of order) {
    const m = new Uint8Array(n); for (let i = 0; i < n; i++) m[i] = seg.label[i] === cl ? 1 : 0;
    const nm = seg.names[cl], ja = JA[nm] || nm.replace(/-other|-merged/, '');
    parts.push({ mask: m, kind: 'thing', name: ja }); names.push(ja);
    const gd = CloudFind.fromMask(m, W, H, 0.01);
    for (const f of CloudFind.find(gd, { ...P, maxFaces: 2 })) {
      f.fy = Math.min(H - f.r * 1.15, f.fy);
      things.push(f);
      for (let i = 0; i < n; i++) if (gd.mask[i]) thingMask[i] = 1;
    }
  }
  let ns = 0, ng = 0; for (let i = 0; i < n; i++) { ns += sky0[i]; ng += gm[i]; }
  ai.ctx = { W, H, grp, sky0, sky, things, thingMask, names, skyPct: Math.round(100 * ns / n), groundPct: Math.round(100 * ng / n) };
  ai.parts = parts; ai.view = null; ai.W = W; ai.H = H;
}
// every detection frame with an AI result: the clouds = the colour detection inside the AI's sky (or the AI's own
// clouds when the colours find almost nothing: overcast, dusk), minus the haze along the skyline; plus the things
function aiFaces() {
  const C = ai.ctx, W = C.W, H = C.H, n = W * H, Gs = SegNet.G, grp = C.grp, sky0 = C.sky0;
  const cm = new Uint8Array(n);
  if (P.aiFaceSrc === 'ai') {   // the AI alone: its "clouds" are the clouds
    for (let i = 0; i < n; i++) cm[i] = grp[i] === Gs.CLOUDS ? 1 : 0;
  } else {                      // with the colour detection (below)
    let nc = 0, nai = 0;
    for (let i = 0; i < n; i++) { if (det.mask[i] && C.sky[i]) { cm[i] = 1; nc++; } if (grp[i] === Gs.CLOUDS) nai++; }
    if (nc < nai * 0.3) for (let i = 0; i < n; i++) if (grp[i] === Gs.CLOUDS) cm[i] = 1;
  }
  // a "cloud" lying along the tops of trees / buildings that the AI calls sky is the haze over the skyline:
  // dropped (a part whose edge touches the non-sky for > 25%, with < half of it AI clouds)
  let cd = CloudFind.fromMask(cm, W, H);
  if (P.aiFaceSrc !== 'ai') {
    const nc0 = cd.comps.length, edge = new Int32Array(nc0), touch = new Int32Array(nc0), aic = new Int32Array(nc0), ar = new Int32Array(nc0);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x, id = cd.label[i]; if (id < 0) continue;
      ar[id]++; if (grp[i] === Gs.CLOUDS) aic[id]++;
      let e = false, t = false;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const X = x + dx, Y = y + dy; if (X < 0 || Y < 0 || X >= W || Y >= H) continue;
        const j = Y * W + X; if (cd.label[j] === id) continue;
        e = true; if (!sky0[j]) t = true;
      }
      if (e) edge[id]++; if (t) touch[id]++;
    }
    let drop = false;
    for (let id = 0; id < nc0; id++) if (edge[id] && touch[id] > edge[id] * 0.25 && aic[id] < ar[id] * 0.5) { drop = true; for (let i = 0; i < n; i++) if (cd.label[i] === id) cm[i] = 0; }
    if (drop) cd = CloudFind.fromMask(cm, W, H);
  }
  const faces = cd.cover > 0 ? CloudFind.find(cd, P) : [];
  for (const f of C.things) if (!faces.some((q) => Math.hypot(q.fx - f.fx, q.fy - f.fy) < (q.r + f.r) * 0.9)) faces.push(f);
  faces.sort((a, b) => b.r - a.r);
  // what the outline pen and the mask view show: these clouds and things
  const all = new Uint8Array(n); for (let i = 0; i < n; i++) all[i] = cd.mask[i] || C.thingMask[i] ? 1 : 0;
  det = CloudFind.fromMask(all, W, H, 0);
  return faces.slice(0, P.maxFaces + 3);
}

// ---------------- touch: tap a face = next character, hold = next expression
let pressT = null, pressAt = null;
const trackAt = (cx, cy) => {
  const dpr = cv.width / innerWidth, x = cx * dpr, y = cy * dpr;
  let best = null, bd = 1e9;
  for (const t of tracks) { if (t.alpha < 0.3 || !t.U0) continue; const d = Math.hypot(t.x0 - x, t.y0 - y) / t.U0; if (d < 1.4 && d < bd) { bd = d; best = t; } }
  return best;
};

    t.exprOver = EXPRS[(EXPRS.indexOf(cur) + 1) % EXPRS.length]; say('表情: ' + t.exprOver); }, 450);

async function shareOrSave(blob, name) {
  const file = new File([blob], name, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

  const type = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find((t) => MediaRecorder.isTypeSupported(t)) || '';
  const chunks = [];
  rec = new MediaRecorder(cv.captureStream(30), type ? { mimeType: type, videoBitsPerSecond: 8e6 } : undefined);

  rec.onstop = () => {
